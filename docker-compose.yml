services:
  temporal-postgres:
    image: postgres:15
    ports:
      - '5432:5432'
  temporal:
    image: temporalio/auto-setup:1.26.2
    ports:
      - '7233:7233'
      - '8080:8080'
  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - '8088:8088'
volumes:
  temporal-postgres-data:
